services:
  ai_fastapi:
    build: ./ai-api
    container_name: ai_fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SEARCH_API_URL: ${SEARCH_API_URL}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OPENCLAW_WEBHOOK_KEY: ${OPENCLAW_WEBHOOK_KEY:-}
    expose:
      - "8008"
    networks:
      - ai_edge

  # Optional: jalankan dengan `docker compose --profile openclaw up -d`
  # OpenClaw berdiri sendiri dan memanggil AI core langsung ke /v1/openclaw.
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    restart: unless-stopped
    profiles: ["openclaw"]
    env_file:
      - .env
    environment:
      OPENCLAW_AI_ENDPOINT: ${OPENCLAW_AI_ENDPOINT:-http://ai_fastapi:8008/v1/openclaw}
      OPENCLAW_AI_KEY: ${OPENCLAW_WEBHOOK_KEY:-}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      - ai_fastapi
    networks:
      - ai_edge

networks:
  ai_edge:
    external: true
    name: ${AI_SHARED_NETWORK:-ai_bridge_local}
