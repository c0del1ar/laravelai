services:
  ai_fastapi:
    build:
      context: ./ai-api
      dockerfile: Dockerfile
    container_name: ai_fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SEARCH_API_URL: ${SEARCH_API_URL}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      TOOL_MANIFEST_API_URL: ${TOOL_MANIFEST_API_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_FALLBACK_MODELS: ${GROQ_FALLBACK_MODELS:-}
      GROQ_RETRY_MAX_ATTEMPTS: ${GROQ_RETRY_MAX_ATTEMPTS:-3}
      GROQ_RETRY_BASE_DELAY_MS: ${GROQ_RETRY_BASE_DELAY_MS:-350}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-256}
      VECTOR_DB_PATH: ${VECTOR_DB_PATH:-/var/lib/ai_fastapi/vector_store.db}
      SEMANTIC_TOP_K: ${SEMANTIC_TOP_K:-10}
      SEMANTIC_MIN_SCORE: ${SEMANTIC_MIN_SCORE:-0.2}
      KB_CACHE_PATH: ${KB_CACHE_PATH:-/var/lib/ai_fastapi/kb_cache.json}
      MEMORY_STORE_PATH: ${MEMORY_STORE_PATH:-/var/lib/ai_fastapi/memory_store.json}
      LEARNING_STORE_PATH: ${LEARNING_STORE_PATH:-/var/lib/ai_fastapi/learning_store.json}
      LEARNING_MAX_EVENTS: ${LEARNING_MAX_EVENTS:-4000}
      INTERNAL_INDEX_KEY: ${INTERNAL_INDEX_KEY:-}
      LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.42}
      AB_EXPERIMENT_ENABLED: ${AB_EXPERIMENT_ENABLED:-false}
      AB_VARIANTS: ${AB_VARIANTS:-control,concise,advisor}
      AB_MODEL_CONTROL: ${AB_MODEL_CONTROL:-}
      AB_MODEL_CONCISE: ${AB_MODEL_CONCISE:-}
      AB_MODEL_ADVISOR: ${AB_MODEL_ADVISOR:-}
      CHANNEL_POLICY_WEB_MAX_SENTENCES: ${CHANNEL_POLICY_WEB_MAX_SENTENCES:-5}
      CHANNEL_POLICY_OPENCLAW_MAX_SENTENCES: ${CHANNEL_POLICY_OPENCLAW_MAX_SENTENCES:-3}
      CHANNEL_POLICY_OPENAI_MAX_SENTENCES: ${CHANNEL_POLICY_OPENAI_MAX_SENTENCES:-4}
      SLO_ALERT_ENABLED: ${SLO_ALERT_ENABLED:-false}
      SLO_ALERT_WEBHOOK_URL: ${SLO_ALERT_WEBHOOK_URL:-}
      SLO_ALERT_COOLDOWN_SECONDS: ${SLO_ALERT_COOLDOWN_SECONDS:-300}
      SLO_HTTP_5XX_RATE_THRESHOLD: ${SLO_HTTP_5XX_RATE_THRESHOLD:-0.05}
      SLO_CHAT_LATENCY_MS_THRESHOLD: ${SLO_CHAT_LATENCY_MS_THRESHOLD:-5000}
      SLO_CHAT_CONFIDENCE_THRESHOLD: ${SLO_CHAT_CONFIDENCE_THRESHOLD:-0.45}
      SLO_MIN_SAMPLE_SIZE: ${SLO_MIN_SAMPLE_SIZE:-20}
      OPENCLAW_WEBHOOK_KEY: ${OPENCLAW_WEBHOOK_KEY:-}
      OPENCLAW_COMPAT_API_KEY: ${OPENCLAW_COMPAT_API_KEY:-}
      OPENCLAW_COMPAT_MODEL_ID: ${OPENCLAW_COMPAT_MODEL_ID:-xiao-an}
    expose:
      - "8008"
    volumes:
      - ai_fastapi_data:/var/lib/ai_fastapi
    networks:
      - ai_edge

  # Optional: jalankan dengan `docker compose --profile openclaw up -d`
  # OpenClaw berdiri sendiri dan memanggil AI core via OpenAI-compatible API FastAPI.
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    restart: unless-stopped
    profiles: ["openclaw"]
    env_file:
      - .env
    environment:
      OPENCLAW_COMPAT_API_KEY: ${OPENCLAW_COMPAT_API_KEY:-}
      OPENCLAW_COMPAT_MODEL_ID: ${OPENCLAW_COMPAT_MODEL_ID:-xiao-an}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      - ai_fastapi
    networks:
      - ai_edge

networks:
  ai_edge:
    external: true
    name: ${AI_SHARED_NETWORK:-ai_bridge_local}

volumes:
  ai_fastapi_data:
    driver: local
