services:
  cli_tool_runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cli_tool_runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLI_TOOL_RUNNER_ADDR: ${CLI_TOOL_RUNNER_ADDR:-:37000}
      CLI_TOOL_RUNNER_BASE_DIR: ${CLI_TOOL_RUNNER_BASE_DIR:-/app}
      CLI_TOOL_RUNNER_CONFIG: ${CLI_TOOL_RUNNER_CONFIG:-/app/config/tools.example.json}
      CLI_TOOL_RUNNER_KEY: ${CLI_TOOL_RUNNER_KEY:-}
      YTMP3_COOKIES_FILE: ${YTMP3_COOKIES_FILE:-/app/cookies/youtube.cookies.txt}
    volumes:
      - ./config:/app/config:ro
      - ./cookies:/app/cookies
      - ./tools:/app/tools:ro
      - ./data:/app/data
    expose:
      - "37000"
    ports:
      - "${CLI_TOOL_RUNNER_HOST_PORT:-37000}:37000"
    networks:
      - ai_edge

networks:
  ai_edge:
    external: true
    name: ${AI_SHARED_NETWORK:-ai_bridge_local}
